lock;color:var(--muted);font-size:12px;font-weight:650;margin-bottom:5px}input,select{background:#192742;color:var(--ink);border:1px solid #314360;border-radius:9px;padding:11px;width:100%;min-height:43px;outline:none}input:focus,select:focus{border-color:var(--blue)}input::placeholder{color:#7e91af}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.list-item{padding:11px 0;border-bottom:1px solid var(--line)}.list-item:last-child{border-bottom:0}.bar{height:8px;background:#263753;border-radius:99px;overflow:hidden;margin:8px 0 4px}.bar>span{display:block;height:100%;background:#7297ff;border-radius:99px}.bar>span.over{background:#ff9a9a}.notice{background:#233459;border:1px solid #395687;border-radius:11px;padding:12px;margin:12px 0;color:#d9e5ff;font-size:13px}.notice.error{background:#422435;border-color:#774052;color:#ffcad0}.empty{color:var(--muted);padding:16px 4px;text-align:center}.bottom{position:fixed;z-index:3;bottom:0;left:0;right:0;background:#101a2df5;border-top:1px solid var(--line);display:flex;justify-content:center;padding:7px max(9px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(14px)}.bottom button{background:none;border:0;color:var(--muted);font-size:10px;flex:1;max-width:144px;min-height:52px;padding:4px 1px}.bottom button b{display:block;font-size:20px;font-weight:400}.bottom button.active{color:#99b3ff}.auth{max-width:460px;margin:55px auto}.hidden,[hidden]{display:none!important}.topline{display:flex;gap:10px;justify-content:space-between;align-items:center}.wraptext{overflow-wrap:anywhere}.tag{color:var(--green);font-size:12px}button.textbtn{border:0;background:transparent;color:var(--red);font-size:12px;padding:4px}.stack{display:grid;gap:6px}.hint{font-size:12px;color:var(--muted)}@media(min-width:700px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.wrap{padding-bottom:90px}.metric .value{font-size:22px}}

<script>
// SET THESE TWO VALUES. Publishable keys are safe in frontend code
// ONLY when Supabase Row Level Security is correctly configured.
const SUPABASE_URL = window.WEALTHOS_CONFIG?.supabaseUrl || '';
const SUPABASE_PUBLISHABLE_KEY = window.WEALTHOS_CONFIG?.publishableKey || '';

const EXPENSE = ['Food & Drinks','Transport','Shopping','Education','Toiletries','Social','Entertainment','Bills','Health','Other'];
const INCOME = ['Allowance','Salary','Freelance','Business','Gift','Dividend','Other'];
const BUDGET = [...EXPENSE,'Investments','Emergency Savings'];
const nf = new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0});
const fmt = v => nf.format(Number(v)||0);
const n = v => Number(v)||0;
const esc = v => String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = v => String(v).padStart(2,'0');
const today = () => {const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;};
const currentMonth = () => today().slice(0,7);
const opts = (items,selected='') => items.map(x=>`<option value="${esc(x)}" ${x===selected?'selected':''}>${esc(x)}</option>`).join('');
const panel = (html,cls='') => `<section class="panel ${cls}">${html}</section>`;
let db=null,user=null,page='home',rows=[],records={},lastRefresh=null,loading=false,month=currentMonth();
// WEALTHOS_INVESTMENT_ACCOUNTS_V5
// Market prices are independent of recorded purchase costs.
let cryptoStatus='Crypto auto-refresh not checked yet';
let lastCryptoAttempt=0;
let cryptoRefreshBusy=false;
const CRYPTO_REFRESH_MS = 5 * 60 * 1000;
const CRYPTO_IDS={
  'BTC':'bitcoin','XBT':'bitcoin','ETH':'ethereum','SOL':'solana',
  'XRP':'ripple','DOGE':'dogecoin','ADA':'cardano',
  'BNB':'binancecoin','LTC':'litecoin','DOT':'polkadot',
  'AVAX':'avalanche-2','USDT':'tether','USDC':'usd-coin'
};
const cryptoCoinId=(symbol)=>CRYPTO_IDS[String(symbol||'').toUpperCase().split('-')[0]]||null;
const basisKey=(symbol,currency,account)=>`basis:${symbol}:${currency}:${account||'unassigned'}`;
const pct = (value,cost) => Number.isFinite(value)&&cost>0 ? `${((value-cost)/cost*100).toFixed(2)}%` : 'N/A';
const ACCOUNT_TYPES=['Cash','Bank','E-wallet','Savings','Broker Cash'];
const ASSET_TYPES=['Asset','Debt'];
// These US-listed tickers quote in USD on Yahoo Finance.
// A bare USD price is NOT the same as the IDR value of your holding.
const KNOWN_USD_TICKERS=new Set(['SPY','VOO','IVV','QQQ','AAPL','MSFT','NVDA','TSLA','AMZN','GOOGL','META']);
function valuationWarning(p) {
  if(KNOWN_USD_TICKERS.has(p.symbol) && p.currency==='IDR')
    return `${p.symbol} is normally quoted in USD. Check whether this IDR holding is a fractional-share product. Auto-fetched Yahoo USD prices must not be treated as IDR.`;
  if(p.currency!=='IDR' && (!Number.isFinite(p.fx)||p.fx<=1.01))
    return `Missing/invalid currency conversion: ${p.currency} price is not an IDR price. Enter an IDR-per-${p.currency} FX rate before trusting the IDR value.`;
  if(p.symbol==='SPY' && p.currency==='USD' && p.price>0 && p.price<20)
    return 'SPY quote looks suspiciously low for a whole ETF share. Check the saved market quote and its source.';
  return '';
}



function notify(message,isError=false){const e=document.querySelector('#alert');e.hidden=false;e.innerHTML=`<div class="notice ${isError?'error':''}">${esc(message)}</div>`;}
function clearNotice(){document.querySelector('#alert').hidden=true;}
function status(text){document.querySelector('#connection').textContent=text;}
function showLoggedIn(on){document.querySelector('#loading').classList.add('hidden');document.querySelector('#signedOut').classList.toggle('hidden',on);document.querySelector('#app').classList.toggle('hidden',!on);document.querySelector('#nav').classList.toggle('hidden',!on);}
function items(kind){return records[kind]||[];}
function normalize(row){if(row.kind==='we_event')return row.data||{};const f=row.data||{};let key=row.id;if(row.kind==='budget')key=`budget:${f.month}:${f.category}`;if(row.kind==='quote')key=`quote:${f.symbol}:${f.currency}`;return {entity_kind:row.kind,entity_id:key,op:'upsert',fields:f,ts:row.created_at};}
function rebuild(){const byEntity=new Map();const sorted=[...rows].sort((a,b)=>{const x=normalize(a),y=normalize(b);return String(x.ts||'').localeCompare(String(y.ts||''))||String(a.id).localeCompare(String(b.id));});for(const row of sorted){const e=normalize(row);if(!e.entity_kind||!e.entity_id)continue;const key=`${e.entity_kind}\u0000${e.entity_id}`;if(e.op==='delete')byEntity.delete(key);else byEntity.set(key,{kind:e.entity_kind,id:e.entity_id,data:e.fields||{},updatedAt:e.ts||row.created_at||''});}records={};for(const item of byEntity.values())(records[item.kind]??=[]).push(item);}
// If a desktop sync overwrites an IDR manual price with a mismatched
// USD stock quote, recover the last explicitly entered manual price.
function lastManualQuote(symbol,currency){
  const history=[...rows].sort((a,b)=>String(b.created_at||normalize(b).ts||'').localeCompare(String(a.created_at||normalize(a).ts||'')));
  for(const row of history){
    const e=normalize(row), f=e.fields||{};
    if(e.entity_kind==='quote'&&e.op==='upsert'&&
       String(f.symbol||'').toUpperCase()===symbol&&
       (f.currency||'IDR')===currency&&
       /^Manual/i.test(String(f.source||''))&&
       Number.isFinite(Number(f.price))&&Number(f.price)>0&&
       Number.isFinite(Number(f.fx))&&Number(f.fx)>0)
      return f;
  }
  return null;
}
// Existing-holding snapshots have action="Opening". They never move cash.
function calc() {
  const accounts = items('account');
  const transactions = items('transaction');
  const trades = items('trade');
  const assets = items('asset');
  const balances = new Map(accounts.map(a => [a.id, n(a.data.opening)]));

  for (const row of transactions) {
    const d = row.data, amount = n(d.amount);
    if (d.type === 'Income') {
      balances.set(d.account, (balances.get(d.account) || 0) + amount);
    } else if (d.type === 'Expense') {
      balances.set(d.account, (balances.get(d.account) || 0) - amount);
    } else if (d.type === 'Transfer') {
      balances.set(d.account, (balances.get(d.account) || 0) - amount);
      balances.set(d.to_account, (balances.get(d.to_account) || 0) + amount);
    }
  }

  const holdings = new Map();
  const ordered = [...trades].sort((a,b) =>
    String(a.data.date || '').localeCompare(String(b.data.date || '')) ||
    String(a.id).localeCompare(String(b.id))
  );

  for (const row of ordered) {
    const d = row.data;
    const symbol = String(d.symbol || '').toUpperCase();
    const currency = String(d.currency || 'IDR');
    const account = d.account || null;
    const key = JSON.stringify([symbol, currency, account]);
    const h = holdings.get(key) || {
      symbol, currency, account, qty:0, cost:0,
      unknownQty:0, lastPrice:0, lastFx:1
    };
    const qty = n(d.qty);
    const price = n(d.price);
    const fx = n(d.fx) || 1;
    const fee = n(d.fee ?? d.fees);
    if (qty <= 0) continue;

    if (d.action === 'Buy' || d.action === 'Opening') {
      h.qty += qty;
      if (d.action === 'Opening' && d.basis_known === false) {
        h.unknownQty += qty;
      } else {
        h.cost += qty * price * fx + fee;
      }
      h.lastPrice = n(d.market_price) || price;
      h.lastFx = n(d.market_fx) || fx;
    } else if (d.action === 'Sell' && h.qty > 0 && qty <= h.qty + 1e-8) {
      const proportion = Math.min(qty / h.qty, 1);
      h.cost -= h.cost * proportion;
      h.unknownQty *= (1 - proportion);
      h.qty = Math.max(0, h.qty - qty);
      h.lastPrice = price;
      h.lastFx = fx;
    }
    holdings.set(key, h);

    // Only real Buy and Sell trades affect money in the linked account.
    if (d.action === 'Buy') {
      const fundedFrom = d.funding_account || account;
      balances.set(fundedFrom, (balances.get(fundedFrom) || 0) - qty*price*fx-fee);
    } else if (d.action === 'Sell') {
      const fundedFrom = d.funding_account || account;
      balances.set(fundedFrom, (balances.get(fundedFrom) || 0) + qty*price*fx-fee);
    }
  }

  const quoteMap = new Map(items('quote').map(r => [
    JSON.stringify([String(r.data.symbol || '').toUpperCase(), r.data.currency || 'IDR']),
    r.data
  ]));
  // Cost basis corrections are accounting-only: no cash or trade effects.
  const basisOverrides = new Map(items('basis_override').map(r=>[
    basisKey(String(r.data.symbol||'').toUpperCase(), r.data.currency||'IDR',r.data.account||null),
    r.data
  ]));
  const accountNames = new Map(accounts.map(a => [a.id, a.data.name]));
  const positions = [...holdings.values()].filter(h => h.qty > 1e-8).map(h => {
    const q = quoteMap.get(JSON.stringify([h.symbol,h.currency])) || {};
    const yahooCurrencyMismatch = KNOWN_USD_TICKERS.has(h.symbol) &&
      h.currency==='IDR' && /Yahoo Finance/i.test(String(q.source||''));
    const suspectSpyUSD = h.symbol==='SPY' && h.currency==='USD' &&
      Number(q.price)>0 && Number(q.price)<20;
    const unreliableQuote = yahooCurrencyMismatch || suspectSpyUSD;
    // Do not silently use mismatched USD stock data or a suspiciously
    // tiny SPY quote. Prefer prior explicit manual IDR valuation, then
    // the original holding estimate, without making up a new price.
    const recoveredQuote = unreliableQuote ? lastManualQuote(h.symbol,h.currency) : null;
    const price = unreliableQuote ? n(recoveredQuote?.price)||h.lastPrice :
      (q.price === undefined ? h.lastPrice : n(q.price));
    let fx = unreliableQuote ? n(recoveredQuote?.fx)||h.lastFx :
      (q.fx === undefined ? h.lastFx : n(q.fx));
    // If a USD quote was saved with FX=1, retain a previously known
    // meaningful conversion rather than claiming $1 equals Rp1.
    if(h.currency!=='IDR' && fx<=1.01 && h.lastFx>1.01) fx=h.lastFx;
    const missingFx=h.currency!=='IDR' && fx<=1.01;
    const value = missingFx ? 0 : h.qty * price * fx;
    const override = basisOverrides.get(basisKey(h.symbol,h.currency,h.account));
    let correctedCost=h.cost;
    if(override){
      if(Number.isFinite(Number(override.baseline_raw_cost))&&n(override.baseline_qty)>0&&
         Number.isFinite(Number(override.corrected_total_idr))){
        // Adjust original raw cost by a correction delta. New Buys add their
        // real cost; subsequent Sells remove a proportional share of the delta.
        let delta=n(override.corrected_total_idr)-n(override.baseline_raw_cost);
        let rollingQty=n(override.baseline_qty);
        const later=trades.filter(r=>
          String(r.data.symbol||'').toUpperCase()===h.symbol&&
          String(r.data.currency||'IDR')===h.currency&&
          (r.data.account||null)===(h.account||null)&&
          Date.parse(r.updatedAt||'')>Date.parse(override.updated_at||'')
        ).sort((a,b)=>String(a.updatedAt).localeCompare(String(b.updatedAt)));
        for(const r of later){
          const q=n(r.data.qty);
          if(r.data.action==='Buy'||r.data.action==='Opening') rollingQty+=q;
          else if(r.data.action==='Sell'&&rollingQty>0){
            const fraction=Math.min(q/rollingQty,1);
            delta *= (1-fraction);
            rollingQty=Math.max(0,rollingQty-q);
          }
        }
        correctedCost=Math.max(0,h.cost+delta);
      } else {
        correctedCost=n(override.average_cost_idr)*h.qty;
      }
    }
    const basisKnown = override ? true : h.unknownQty < 1e-8;
    return {
      ...h,price,fx,value,basisKnown,rawCost:h.cost,
      cost:correctedCost,
      basisOverride:!!override,
      profit:basisKnown ? value - correctedCost : null,
      accountName:accountNames.get(h.account) || 'Unassigned',
      source:unreliableQuote ? 'Unreliable stock quote rejected; '+(recoveredQuote?.source||'opening estimate') :
        (q.source || 'Opening estimate / last trade (not live)'),
      asOf:unreliableQuote ? (recoveredQuote?.at||'Using older recorded estimate; verify manually') :
        (q.at || 'No current market quote')
    };
  });
  const cash = [...balances.values()].reduce((a,b)=>a+b,0);
  const invested = positions.reduce((a,p)=>a+p.value,0);
  const otherAssets=assets.filter(x=>x.data.type==='Asset').reduce((a,r)=>a+n(r.data.value),0);
  const debts=assets.filter(x=>x.data.type==='Debt').reduce((a,r)=>a+n(r.data.value),0);
  return {balances,positions,cash,invested,otherAssets,debts,net:cash+invested+otherAssets-debts};
}

function spentFor(m) {
  const spent={};
  const accKind=new Map(items('account').map(a=>[a.id,a.data.kind]));
  const add=(key,value)=>spent[key]=(spent[key]||0)+value;
  for (const r of items('transaction')) {
    const d=r.data;
    if (String(d.date||'').slice(0,7)!==m) continue;
    const amount=n(d.amount);
    if (d.type==='Expense') add(d.category||'Other',amount);
    else if(d.type==='Transfer') {
      if(accKind.get(d.to_account)==='Savings'&&accKind.get(d.account)!=='Savings') add('Emergency Savings',amount);
      if(accKind.get(d.account)==='Savings'&&accKind.get(d.to_account)!=='Savings') add('Emergency Savings',-amount);
    }
  }
  for(const r of items('trade')) {
    const d=r.data;
    if(String(d.date||'').slice(0,7)!==m) continue;
    const amount=n(d.qty)*n(d.price)*n(d.fx);
    if(d.action==='Buy') add('Investments',amount);
    else if(d.action==='Sell') add('Investments',-amount);
    // 'Opening' is not a purchase and is never a monthly expense.
  }
  return spent;
}

function accountOptions(){return items('account').map(a=>`<option value="${esc(a.id)}">${esc(a.data.name)}</option>`).join('');}
function metric(label,value,extra=''){return panel(`<div class="metric"><p class="small muted">${esc(label)}</p><div class="value">${fmt(value)}</div>${extra?`<p class="small muted">${extra}</p>`:''}</div>`);}
function budgetBars(m){const spent=spentFor(m);const budgets=items('budget').filter(x=>x.data.month===m);if(!budgets.length)return '<div class="empty">No monthly budgets set yet.</div>';return budgets.map(r=>{const d=r.data,limit=n(d.limit),actual=n(spent[d.category]),ratio=limit>0?actual/limit:0;return `<div class="list-item"><div class="row"><strong>${esc(d.category)}</strong><span class="small muted">${fmt(actual)} / ${fmt(limit)}</span></div><div class="bar"><span class="${ratio>1?'over':''}" style="width:${Math.min(Math.max(ratio*100,0),100)}%"></span></div></div>`;}).join('');}
function home(){const c=calc();const recent=[...items('transaction')].sort((a,b)=>String(b.data.date||'').localeCompare(String(a.data.date||''))).slice(0,5);return `<h1>Financial Overview</h1><div class="grid">${metric('Net worth',c.net)}${metric('Cash & banks',c.cash)}${metric('Investments',c.invested)}${metric('Debts',c.debts)}</div>${panel(`<div class="topline"><h3>Monthly spending</h3><span class="pill">${esc(month)}</span></div>${budgetBars(month)}`)}${panel(`<h3>Recent activity</h3>${recent.length?recent.map(r=>`<div class="list-item row"><div><strong>${esc(r.data.note||r.data.category||r.data.type)}</strong><div class="small muted">${esc(r.data.date)} · ${esc(r.data.type)}</div></div><span class="amount ${r.data.type==='Expense'?'neg':'pos'}">${r.data.type==='Expense'?'-':r.data.type==='Income'?'+':''}${fmt(r.data.amount)}</span></div>`).join(''):'<div class="empty">No transactions yet.</div>'}`)}${panel(`<h3>Account balances</h3>${items('account').length?items('account').map(a=>`<div class="row list-item"><div>${esc(a.data.name)} <span class="small muted">${esc(a.data.kind)}</span></div><strong>${fmt(c.balances.get(a.id)||0)}</strong></div>`).join(''):'<div class="empty">Add your first account.</div>'}`)}`;}
function transactionsPage(){const acc=items('account');return `<h1>Transactions</h1>${acc.length?panel(`<h3>Add transaction</h3><form id="transactionForm"><div class="two"><div><label>Type</label><select name="type" id="transactionType"><option>Expense</option><option>Income</option><option>Transfer</option></select></div><div><label>Date</label><input name="date" type="date" value="${today()}" required></div></div><div><label>Amount (IDR)</label><input name="amount" type="number" min="0.01" step="any" required placeholder="50000"></div><div><label>Account</label><select name="account" required>${accountOptions()}</select></div><div id="destinationGroup" hidden><label>Destination account</label><select name="to_account">${accountOptions()}</select></div><div id="categoryGroup"><label>Category</label><select id="transactionCategory" name="category">${opts(EXPENSE)}</select></div><div><label>Description</label><input name="note" maxlength="200" placeholder="Lunch, transport, allowance..."></div><button class="btn full">Save transaction</button></form>`):panel('<p>Create an account before entering a transaction.</p>')}${panel(`<h3>Transaction history</h3>${[...items('transaction')].sort((a,b)=>String(b.data.date||'').localeCompare(String(a.data.date||''))).map(r=>`<div class="list-item"><div class="row"><div><strong>${esc(r.data.note||r.data.category||r.data.type)}</strong><div class="small muted">${esc(r.data.date)} · ${esc(r.data.category||r.data.type)}</div></div><strong class="amount ${r.data.type==='Expense'?'neg':''}">${fmt(r.data.amount)}</strong></div><button class="textbtn" data-delete-kind="transaction" data-delete-id="${esc(r.id)}">Delete</button></div>`).join('')||'<div class="empty">No transactions recorded.</div>'}`)}`;}
function budgetsPage(){return `<h1>Monthly Budgets</h1>${panel(`<label>Month</label><input id="monthPicker" type="month" value="${esc(month)}">`)}${panel(`<h3>Set monthly category target</h3><form id="budgetForm"><div><label>Category</label><select name="category">${opts(BUDGET)}</select></div><div><label>Monthly limit (IDR)</label><input name="limit" type="number" min="0" step="any" required></div><button class="btn">Save budget</button></form>`)}${panel(`<h3>Budget vs actual</h3>${budgetBars(month)}<p class="hint">Investments and emergency savings are allocation targets, not everyday expenses.</p>`)}`;}

// Crypto-only independent mobile market price refresh.
// CORS-permitting CoinGecko public endpoint; may be rate-limited.
async function refreshCryptoPrices(force=false) {
  if (!user || !db || cryptoRefreshBusy || document.visibilityState !== 'visible') return;
  const now=Date.now();
  if (!force && now-lastCryptoAttempt<CRYPTO_REFRESH_MS) return;
  const positions=calc().positions;
  const cryptoPositions=positions.filter(p=>!!cryptoCoinId(p.symbol));
  if (!cryptoPositions.length) {
    cryptoStatus='No supported crypto holdings to refresh.';
    return;
  }
  lastCryptoAttempt=now;
  cryptoRefreshBusy=true;
  cryptoStatus='Checking crypto market prices…';
  if (page==='portfolio') render();
  try {
    const ids=[...new Set(cryptoPositions.map(p=>cryptoCoinId(p.symbol)))];
    const url='https://api.coingecko.com/api/v3/simple/price?ids='+
      encodeURIComponent(ids.join(','))+'&vs_currencies=idr,usd&include_last_updated_at=true';
    const response=await fetch(url,{cache:'no-store'});
    if(!response.ok) throw Error('Price provider returned HTTP '+response.status);
    const data=await response.json();
    const updates=[];
    const checked=new Set();
    for (const p of cryptoPositions) {
      const coinId=cryptoCoinId(p.symbol);
      const quoteKey=JSON.stringify([p.symbol,p.currency]);
      if(checked.has(quoteKey)) continue;
      checked.add(quoteKey);
      const coin=data[coinId];
      if(!coin) continue;
      const idr=Number(coin.idr), usd=Number(coin.usd);
      const latest=Number(coin.last_updated_at);
      // Reject obviously stale market data instead of labelling it live.
      if(!Number.isFinite(idr)||idr<=0||!Number.isFinite(usd)||usd<=0||
         !Number.isFinite(latest)||latest<=0||(Date.now()/1000-latest)>6*3600) continue;
      const price=p.currency==='IDR'?idr: p.currency==='USD'?usd:null;
      if(!price) continue; // Other currency markets require a reliable FX source.
      const fx=p.currency==='IDR'?1:idr/usd;
      const old=items('quote').find(r=>
        String(r.data.symbol||'').toUpperCase()===p.symbol&&
        (r.data.currency||'IDR')===p.currency
      )?.data||{};
      // Ignore negligible price differences, except if market quote is stale.
      const oldAge=Date.now()-Date.parse(old.at||0);
      const unchanged=Number(old.price)>0 &&
        Math.abs(Number(old.price)-price)/price<0.0000001 &&
        Math.abs((Number(old.fx)||1)-fx)/fx<0.0000001;
      if(unchanged && Number.isFinite(oldAge) && oldAge<30*60*1000) continue;
      const stamp=new Date().toISOString();
      updates.push({id:crypto.randomUUID(),user_id:user.id,kind:'we_event',data:{
        entity_kind:'quote',entity_id:`quote:${p.symbol}:${p.currency}`,op:'upsert',
        fields:{symbol:p.symbol,currency:p.currency,price,fx,
          source:'CoinGecko (may be delayed)',at:new Date(latest*1000).toISOString()},
        ts:stamp
      }});
    }
    if(updates.length){
      const {error}=await db.from('finance_records').insert(updates);
      if(error) throw error;
      await loadData(true);
    }
    const label=new Date().toLocaleTimeString();
    cryptoStatus=`Crypto checked ${label}: ${updates.length} quote update(s).`;
  } catch(e) {
    cryptoStatus='Crypto refresh unavailable ('+String(e.message||e).slice(0,100)+'). Saved prices retained.';
  } finally {
    cryptoRefreshBusy=false;
    if(page==='portfolio'&&user) render();
  }
}

// Prevent removing a buy/opening that would leave a sale without holdings.
async function moveExistingHolding(symbol,currency,oldAccount,newAccount,correctFunding) {
  if(!user||!db) throw Error('Sign in to Supabase first.');
  if(!newAccount||newAccount===oldAccount) throw Error('Choose a different investment account.');
  if(!items('account').some(a=>a.id===newAccount&&a.data.kind==='Broker Cash'))
    throw Error('Destination must be an existing investment account.');
  const relevant=items('trade').filter(r=>
    String(r.data.symbol||'').toUpperCase()===symbol &&
    String(r.data.currency||'IDR')===currency && (r.data.account||null)===oldAccount
  );
  if(!relevant.length) throw Error('No investment entries found to move.');
  if(items('trade').some(r=>
    String(r.data.symbol||'').toUpperCase()===symbol &&
    String(r.data.currency||'IDR')===currency && (r.data.account||null)===newAccount
  )) throw Error('Destination already contains entries for this asset. Merge requires a separate cost-basis review.');
  const p=calc().positions.find(x=>x.symbol===symbol&&x.currency===currency&&x.account===oldAccount);
  if(!p) throw Error('The original holding is missing. Refresh the page.');
  const oldBasisId=basisKey(symbol,currency,oldAccount);
  const newBasisId=basisKey(symbol,currency,newAccount);
  const basis=items('basis_override').find(r=>r.id===oldBasisId);
  if(basis && items('basis_override').some(r=>r.id===newBasisId))
    throw Error('The target holding has an existing cost-basis correction.');
  const batch=[];
  const mostRecentEvent=Math.max(0,...rows.map(r=>Date.parse(normalize(r).ts||'')).filter(Number.isFinite));
  const baseTime=Math.max(Date.now(),mostRecentEvent+5);
  const stamp=()=>new Date(baseTime+batch.length*3).toISOString();
  const add=(kind,id,fields,op='upsert')=>{
    const at=stamp();
    batch.push({id:crypto.randomUUID(),user_id:user.id,kind:'we_event',data:{
      entity_kind:kind,entity_id:id,op,fields,ts:at
    }});
  };
  for(const r of relevant) {
    const fields={...r.data,account:newAccount};
    if(fields.action==='Buy'||fields.action==='Sell')
      fields.funding_account=correctFunding?newAccount:(r.data.funding_account||oldAccount);
    add('trade',r.id,fields);
  }
  if(basis) {
    add('basis_override',oldBasisId,{},'delete');
    add('basis_override',newBasisId,{
      ...basis.data,symbol,currency,account:newAccount,
      average_cost_idr:p.cost/p.qty,
      baseline_qty:p.qty,baseline_raw_cost:p.rawCost,
      corrected_total_idr:p.cost,
      updated_at:new Date(baseTime+batch.length*3+5).toISOString()
    });
  }
  // One authenticated database request; no new purchases are created.
  const {error}=await db.from('finance_records').insert(batch);
  if(error) throw error;
  await loadData(true);
  return relevant.length;
}

function validAfterTradeRemoval(tradeId) {
  const kept=[...items('trade')].filter(r=>r.id!==tradeId).sort((a,b)=>
    String(a.data.date||'').localeCompare(String(b.data.date||''))||a.id.localeCompare(b.id)
  );
  const quantities=new Map();
  for(const r of kept){
    const d=r.data;
    const key=JSON.stringify([String(d.symbol||'').toUpperCase(),d.currency||'IDR',d.account||null]);
    const old=quantities.get(key)||0;
    const qty=Number(d.qty)||0;
    if(d.action==='Buy'||d.action==='Opening') quantities.set(key,old+qty);
    if(d.action==='Sell') {
      if(qty>old+1e-8) return false;
      quantities.set(key,Math.max(0,old-qty));
    }
  }
  return true;
}

async function loadData(silent=false){if(!user||loading)return;loading=true;status('Syncing cloud...');try{const out=[];for(let from=0;;from+=1000){const {data,error}=await db.from('finance_records').select('id,kind,data,created_at').eq('user_id',user.id).order('created_at',{ascending:true}).range(from,from+999);if(error)throw error;out.push(...(data||[]));if(!data||data.length<1000)break;}rows=out;rebuild();lastRefresh=new Date();status('● Cloud connected');render();if(!silent)clearNotice();}catch(e){status('⚠ Sync failed');notify('Could not load Supabase records: '+e.message,true);}finally{loading=false;}}
async function save(kind,fields,entityId=crypto.randomUUID(),isDelete=false){if(!user)throw Error('Please sign in first');const stamp=new Date().toISOString();const {error}=await db.from('finance_records').insert({id:crypto.randomUUID(),user_id:user.id,kind:'we_event',data:{entity_kind:kind,entity_id:entityId,op:isDelete?'delete':'upsert',fields:fields||{},ts:stamp}});if(error)throw error;await loadData();}
async function login(){clearNotice();const btn=document.querySelector('#googleLogin');btn.disabled=true;try{const {error}=await db.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});if(error)throw error;}catch(e){notify('Google sign-in failed: '+e.message,true);btn.disabled=false;}}
async function setup(){if(!SUPABASE_URL.startsWith('https://')||!SUPABASE_PUBLISHABLE_KEY||SUPABASE_URL.includes('YOUR-PROJECT')||SUPABASE_PUBLISHABLE_KEY.includes('YOUR_KEY')){document.querySelector('#loading').classList.add('hidden');status('Setup needed');notify('Edit config.js and enter your Supabase project URL and publishable key.',true);return;}if(!window.supabase){document.querySelector('#loading').classList.add('hidden');status('Connection unavailable');notify('Could not load Supabase JavaScript. Check your internet connection.',true);return;}db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{flowType:'pkce',detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});document.querySelector('#googleLogin').addEventListener('click',login);const params=new URLSearchParams(location.search);const oauthError=params.get('error_description');if(oauthError)notify('Google sign-in: '+oauthError,true);const {data,error}=await db.auth.getUser();if(error&&!String(error.message).toLowerCase().includes('session'))notify('Auth: '+error.message,true);if(data?.user){user=data.user;showLoggedIn(true);await loadData();setTimeout(()=>refreshCryptoPrices(),0);}else{showLoggedIn(false);status('Sign in to continue');}db.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){user=null;rows=[];records={};showLoggedIn(false);status('Signed out');}else if(event==='SIGNED_IN'&&session?.user?.id!==user?.id){user=session.user;showLoggedIn(true);setTimeout(async()=>{await loadData();await refreshCryptoPrices();},0);}});}
// Every user action is validated before inserting an event.
document.addEventListener('submit',async e=>{const form=e.target;if(!form.classList.contains('moveHoldingForm') && !form.classList.contains('basisForm') && !form.classList.contains('editAccountForm') && !form.classList.contains('editAssetForm') && (!form.id||!['transactionForm','budgetForm','tradeForm','openingHoldingForm','brokerForm','accountForm','assetForm','quoteForm'].includes(form.id)))return;e.preventDefault();const submit=form.querySelector('button[type="submit"],button:not([type])');if(submit)submit.disabled=true;const f=new FormData(form);try{
if(form.classList.contains('moveHoldingForm')){
  const [symbol,currency,oldAccount]=JSON.parse(decodeURIComponent(String(f.get('key'))));
  const target=String(f.get('target')||'');
  const correctFunding=f.has('correct_funding');
  const sourceName=items('account').find(a=>a.id===oldAccount)?.data.name||'original account';
  const destName=items('account').find(a=>a.id===target)?.data.name||'destination';
  const note=correctFunding?'Historical Buy/Sell cash effects will also move.':'Historical cash balances will stay unchanged.';
  if(!confirm(`Move all ${symbol} entries from ${sourceName} to ${destName}?\n${note}`)) return;
  const moved=await moveExistingHolding(symbol,currency,oldAccount,target,correctFunding);
  notify(`Moved ${moved} ${symbol} investment entry/entries to ${destName}. Your units and purchase cost remain unchanged.`);
  return;
}
else if(form.classList.contains('basisForm')){
  const key=JSON.parse(decodeURIComponent(String(f.get('key'))));
  const [symbol,currency,account]=key;
  const p=calc().positions.find(x=>x.symbol===symbol&&x.currency===currency&&x.account===account);
  if(!p) throw Error('This position no longer exists. Refresh and try again.');
  const amount=Number(f.get('amount'));
  if(!Number.isFinite(amount)||amount<=0) throw Error('Enter a positive purchase cost in IDR.');
  const avg=f.get('mode')==='average'?amount:amount/p.qty;
  await save('basis_override',{symbol,currency,account,average_cost_idr:avg,
    baseline_raw_cost:p.rawCost,baseline_qty:p.qty,corrected_total_idr:avg*p.qty,
    updated_at:new Date().toISOString()},basisKey(symbol,currency,account));
}
else if(form.classList.contains('editAccountForm')){
  const id=String(f.get('id'));
  const old=items('account').find(a=>a.id===id);
  if(!old) throw Error('Account no longer exists. Refresh first.');
  const name=String(f.get('name')||'').trim();
  const kind=String(f.get('kind'));
  const opening=Number(f.get('opening'));
  if(!name||name.length>70||!ACCOUNT_TYPES.includes(kind)||!Number.isFinite(opening)||opening<0)
    throw Error('Check your account name, type and opening balance.');
  const linkedTrades=items('trade').some(r=>r.data.account===id||r.data.funding_account===id);
  if(old.data.kind==='Broker Cash'&&kind!=='Broker Cash'&&linkedTrades)
    throw Error('This brokerage account has investment entries. Keep its type as Broker Cash until you move/remove those entries. Renaming is still allowed.');
  if((old.data.kind==='Savings')!== (kind==='Savings') &&
      items('transaction').some(r=>r.data.account===id||r.data.to_account===id) &&
      !confirm('Changing Savings classification may change past Emergency Savings budget totals. Continue?')) return;
  await save('account',{...old.data,name,kind,opening},id);
}
else if(form.classList.contains('editAssetForm')){
  const id=String(f.get('id'));
  const old=items('asset').find(a=>a.id===id);
  if(!old) throw Error('Asset no longer exists. Refresh first.');
  const name=String(f.get('name')||'').trim();
  const type=String(f.get('type'));
  const value=Number(f.get('value'));
  if(!name||name.length>100||!ASSET_TYPES.includes(type)||!Number.isFinite(value)||value<0)
    throw Error('Check the asset name, type and value.');
  await save('asset',{...old.data,name,type,value},id);
}
else if(form.id==='transactionForm'){const type=f.get('type'),amount=n(f.get('amount')),account=f.get('account'),to=f.get('to_account');if(amount<=0)throw Error('Amount must be greater than zero');if(type==='Transfer'&&account===to)throw Error('Choose two different accounts');await save('transaction',{date:f.get('date'),type,amount,account,to_account:type==='Transfer'?to:null,category:type==='Transfer'?'Transfer':f.get('category'),note:f.get('note')||''});}
else if(form.id==='budgetForm'){const category=f.get('category');await save('budget',{month,category,limit:n(f.get('limit'))},`budget:${month}:${category}`);}
else if(form.id==='accountForm'){await save('account',{name:String(f.get('name')).trim(),kind:f.get('kind'),opening:n(f.get('opening'))});}
else if(form.id==='assetForm'){await save('asset',{name:String(f.get('name')).trim(),type:f.get('type'),value:n(f.get('value'))});}
else if(form.id==='brokerForm') {
  const name=String(f.get('name')||'').trim();
  const opening=Number(f.get('opening'));
  if(!name||!Number.isFinite(opening)||opening<0) throw Error('Enter a name and valid uninvested cash amount.');
  await save('account',{name,kind:'Broker Cash',opening});
}
else if(form.id==='openingHoldingForm') {
  const account=f.get('account');
  const symbol=String(f.get('symbol')||'').trim().toUpperCase();
  const currency=f.get('currency');
  const qty=Number(f.get('qty'));
  const price=Number(f.get('price'));
  const fx=Number(f.get('fx'));
  const market_price=Number(f.get('market_price'));
  if(!items('account').some(a=>a.id===account&&a.data.kind==='Broker Cash')) throw Error('Select an investment account.');
  if(!symbol||!Number.isFinite(qty)||qty<=0||!Number.isFinite(price)||price<0||!Number.isFinite(fx)||fx<=0||!Number.isFinite(market_price)||market_price<0) throw Error('Check the quantity, price and exchange rate.');
  await save('trade',{
    date:f.get('date'),action:'Opening',symbol,currency,qty,price,fx,
    market_price,market_fx:fx,fee:0,account,basis_known:price>0
  });
}
else if(form.id==='tradeForm'){const action=f.get('action'),symbol=String(f.get('symbol')||'').trim().toUpperCase(),currency=f.get('currency'),qty=n(f.get('qty')),price=n(f.get('price')),fx=n(f.get('fx')),fee=n(f.get('fee')),account=f.get('account');if(!symbol||qty<=0||price<=0||fx<=0||fee<0)throw Error('Enter valid trade details');const c=calc();if(action==='Buy'&&qty*price*fx+fee>(c.balances.get(account)||0))throw Error('Insufficient available cash in this account');const holding=c.positions.find(p=>p.symbol===symbol&&p.currency===currency&&p.account===account);if(action==='Sell'&&qty>(holding?.qty||0)+1e-8)throw Error('Cannot sell more units than recorded');await save('trade',{date:f.get('date'),action,symbol,currency,qty,price,fx,fee,account});}
else if(form.id==='quoteForm'){
  const [symbol,currency]=String(f.get('key')).split('|');
  const price=Number(f.get('price')),fx=Number(f.get('fx'));
  if(!Number.isFinite(price)||price<=0||!Number.isFinite(fx)||fx<=0)
    throw Error('Enter a valid per-unit price and exchange rate.');
  if(currency!=='IDR'&&fx<=1.01)
    throw Error(`The price is in ${currency}. Enter an IDR-per-${currency} exchange rate (not 1).`);
  if(currency==='IDR'&&KNOWN_USD_TICKERS.has(symbol)&&
      !confirm(`${symbol} normally trades in USD. You are saving a manual IDR valuation. Continue only if you know this is the correct IDR price PER recorded unit.`)) return;
  await save('quote',{symbol,currency,price,fx,source:'Manual mobile (per-unit valuation)',at:new Date().toISOString()},`quote:${symbol}:${currency}`);
}
notify('Saved to Supabase. Your desktop will receive it after synchronization.');}catch(err){notify('Could not save: '+err.message,true);}finally{if(submit)submit.disabled=false;}});
document.addEventListener('click', async e => {
  const nav=e.target.closest('[data-page]');
  if(nav){
    page=nav.dataset.page; clearNotice(); render(); window.scrollTo(0,0);
    if(page==='portfolio') refreshCryptoPrices();
    return;
  }
  const reset=e.target.closest('[data-reset-basis]');
  if(reset){
    const [symbol,currency,account]=JSON.parse(decodeURIComponent(reset.dataset.resetBasis));
    if(!confirm(`Remove your cost correction for ${symbol}? The original recorded cost will be restored.`)) return;
    try {await save('basis_override',{},basisKey(symbol,currency,account),true);notify('Cost correction removed.');}
    catch(err){notify('Could not undo: '+err.message,true);}
    return;
  }
  const delAccount=e.target.closest('[data-delete-account]');
  if(delAccount){
    const id=delAccount.dataset.deleteAccount;
    const original=items('account').find(a=>a.id===id);
    if(!original) return;
    const linkedTransactions=items('transaction').filter(r=>r.data.account===id||r.data.to_account===id);
    const linkedTrades=items('trade').filter(r=>r.data.account===id||r.data.funding_account===id);
    const remainingCash=calc().balances.get(id)||0;
    if(Math.abs(remainingCash)>0.01){
      notify(`Cannot delete ${original.data.name}: this account still has ${fmt(remainingCash)} in cash. Transfer or reconcile the balance first.`,true);
      return;
    }
    if(linkedTransactions.length||linkedTrades.length){
      notify(`Cannot delete ${original.data.name}: ${linkedTransactions.length} linked transaction(s) and ${linkedTrades.length} investment entry/entries. Delete/correct/reassign those records first so cash and holdings are not orphaned.`,true);
      return;
    }
    if(!confirm(`Delete account "${original.data.name}"? Only accounts with NO linked records can be deleted. This cannot be undone from the app.`)) return;
    try {await save('account',{},id,true);notify('Account deleted.');}
    catch(err){notify('Account deletion failed: '+err.message,true);}
    return;
  }
  const del=e.target.closest('[data-delete-kind]');
  if(del){
    const kind=del.dataset.deleteKind, id=del.dataset.deleteId;
    if(kind==='trade' && !validAfterTradeRemoval(id)) {
      notify('Delete or correct later Sell entries first; otherwise this holding would become negative.',true);
      return;
    }
    const description=kind==='trade' ?
      'Delete this investment entry? Opening entries do not affect cash. Deleting a Buy or Sell WILL also recalculate cash and investment history.' :
      'Delete this record?';
    if(!confirm(description)) return;
    try{
      const removed=kind==='trade'?items('trade').find(r=>r.id===id):null;
      const d=removed?.data;
      await save(kind,{},id,true);
      // Removing a historic entry invalidates an old cost-basis snapshot.
      // Clear it so corrected cost cannot silently become inaccurate.
      const affectedBasis=d?basisKey(String(d.symbol||'').toUpperCase(),d.currency||'IDR',d.account||null):null;
      if(affectedBasis && items('basis_override').some(r=>r.id===affectedBasis))
        await save('basis_override',{},affectedBasis,true);
      notify('Record deleted.');
    }
    catch(err){notify('Delete failed: '+err.message,true);}
    return;
  }
  const assetEdit=e.target.closest('[data-edit-asset]');
  if(assetEdit){
    const original=items('asset').find(x=>x.id===assetEdit.dataset.editAsset);
    if(!original)return;
    const answer=prompt('Correct value (IDR)',String(original.data.value??0));
    if(answer===null)return;
    const value=Number(answer);
    if(!Number.isFinite(value)||value<0){notify('Enter a valid nonnegative value.',true);return;}
    try{await save('asset',{...original.data,value},original.id);notify('Asset value updated.');}
    catch(err){notify('Update failed: '+err.message,true);}
    return;
  }
  const edit=e.target.closest('[data-edit-account]');
  if(edit){
    const original=items('account').find(a=>a.id===edit.dataset.editAccount);
    if(!original)return;
    const answer=prompt('New opening balance (IDR)',String(original.data.opening||0));
    if(answer===null)return;
    const value=Number(answer);
    if(!Number.isFinite(value)||value<0){notify('Enter a valid, nonnegative number.',true);return;}
    try{await save('account',{...original.data,opening:value},original.id);notify('Opening balance updated.');}
    catch(err){notify('Update failed: '+err.message,true);}
    return;
  }
  const action=e.target.closest('[data-action]')?.dataset.action;
  if(action==='sync') await loadData();
  if(action==='refresh-prices') await refreshCryptoPrices(true);
  if(action==='logout') await db.auth.signOut();
});
